[package]
name = "russhtviewer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Russht Viewer: token-authenticated multi-device shell access over a private Tailscale fleet (CLI/TUI + browser)."
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mmdmcy/russhtviewer"
homepage = "https://github.com/mmdmcy/russhtviewer"
keywords = ["ssh", "pty", "terminal", "tailscale", "tui"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.8", features = ["ws", "json"] }
bytes = "1.10.1"
crossterm = "0.28.1"
futures-util = "0.3.31"
parking_lot = "0.12.5"
portable-pty = "0.8.1"
rand = "0.9.2"
ratatui = "0.29.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "sync", "time", "io-util", "process"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = "symbols"
