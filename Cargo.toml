[package]
name = "russhtviewer"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
description = "Russht Viewer: click between shells on your own devices. A tmux sidebar over plain SSH; no agent, token or open port."
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mmdmcy/russhtviewer"
homepage = "https://github.com/mmdmcy/russhtviewer"
keywords = ["ssh", "tmux", "terminal", "fleet", "tui"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = "symbols"
