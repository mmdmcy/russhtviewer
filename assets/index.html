<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Russht Viewer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
  <style>
    :root {
      --bg: #12140f;
      --panel: #1c2118;
      --ink: #e8ecdf;
      --muted: #9aa392;
      --accent: #8fbf5f;
      --line: #2c3326;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(143,191,95,0.12), transparent 40%),
        linear-gradient(160deg, #0f120c, #171b14 55%, #10130e);
      color: var(--ink);
      min-height: 100vh;
    }
    header {
      display: flex;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--line);
    }
    h1 {
      margin: 0;
      font-family: "IBM Plex Serif", Georgia, serif;
      font-size: 1.4rem;
      letter-spacing: 0.02em;
    }
    main {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: calc(100vh - 64px);
    }
    aside {
      border-right: 1px solid var(--line);
      padding: 1rem;
      background: rgba(28,33,24,0.7);
    }
    .device {
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      padding: 0.75rem;
      margin-bottom: 0.6rem;
      cursor: pointer;
    }
    .device.online { border-color: rgba(143,191,95,0.55); }
    .device strong { display: block; }
    .muted { color: var(--muted); font-size: 0.85rem; }
    .workspace { display: flex; flex-direction: column; min-width: 0; }
    .tabs {
      display: flex;
      gap: 0.4rem;
      padding: 0.6rem 0.8rem;
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
    }
    .tab {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      padding: 0.35rem 0.7rem;
      cursor: pointer;
    }
    .tab.active { border-color: var(--accent); color: var(--accent); }
    #termHost { flex: 1; padding: 0.5rem; min-height: 0; }
    .login {
      max-width: 420px;
      margin: 12vh auto;
      padding: 1.5rem;
      background: rgba(28,33,24,0.9);
      border: 1px solid var(--line);
    }
    input, button.action {
      width: 100%;
      margin-top: 0.6rem;
      padding: 0.7rem 0.8rem;
      border: 1px solid var(--line);
      background: #0f130d;
      color: var(--ink);
    }
    button.action { background: var(--accent); color: #10140c; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div id="loginView" class="login">
    <h1>Russht Viewer</h1>
    <p class="muted">Paste the shared Masterdale bearer token to see the fleet and open shells.</p>
    <input id="tokenInput" type="password" placeholder="DALE_TOKEN" autocomplete="current-password">
    <button class="action" id="loginButton">Continue</button>
    <p class="muted" id="loginHint"></p>
  </div>

  <div id="appView" hidden>
    <header>
      <h1>Russht Viewer</h1>
      <span class="muted" id="headerMeta"></span>
    </header>
    <main>
      <aside>
        <div id="deviceList"></div>
        <button class="action" id="refreshButton">Refresh</button>
        <button class="action" id="newTabButton">New terminal</button>
      </aside>
      <section class="workspace">
        <div class="tabs" id="tabs"></div>
        <div id="termHost"></div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script>
    const TOKEN_KEY = "russht.masterdale.token";
    const state = {
      token: "",
      devices: [],
      selectedDevice: null,
      tabs: [],
      activeTab: null,
      tabSeq: 0
    };

    const loginView = document.getElementById("loginView");
    const appView = document.getElementById("appView");
    const tokenInput = document.getElementById("tokenInput");
    const loginButton = document.getElementById("loginButton");
    const loginHint = document.getElementById("loginHint");
    const deviceList = document.getElementById("deviceList");
    const tabsEl = document.getElementById("tabs");
    const termHost = document.getElementById("termHost");
    const headerMeta = document.getElementById("headerMeta");

    function authHeaders() {
      return { Authorization: `Bearer ${state.token}` };
    }

    async function loadDevices() {
      const response = await fetch("/v1/fleet/devices", { headers: authHeaders(), cache: "no-store" });
      if (!response.ok) throw new Error(`devices ${response.status}`);
      const payload = await response.json();
      state.devices = payload.devices || [];
      renderDevices();
      headerMeta.textContent = `${state.devices.length} devices`;
    }

    function renderDevices() {
      deviceList.textContent = "";
      for (const device of state.devices) {
        const button = document.createElement("button");
        button.className = `device ${device.online ? "online" : ""}`;
        button.innerHTML = `<strong>${device.display_name}</strong><span class="muted">${device.online ? "online" : "offline"} · ${device.os}</span>`;
        button.onclick = () => {
          state.selectedDevice = device;
          openTab(device);
        };
        deviceList.appendChild(button);
      }
    }

    function renderTabs() {
      tabsEl.textContent = "";
      for (const tab of state.tabs) {
        const button = document.createElement("button");
        button.className = `tab ${state.activeTab === tab.id ? "active" : ""}`;
        button.textContent = tab.title;
        button.onclick = () => activateTab(tab.id);
        tabsEl.appendChild(button);
      }
    }

    function activateTab(id) {
      state.activeTab = id;
      for (const tab of state.tabs) {
        tab.container.hidden = tab.id !== id;
      }
      renderTabs();
      const active = state.tabs.find((tab) => tab.id === id);
      if (active) {
        active.fit.fit();
        active.term.focus();
      }
    }

    function openTab(device) {
      const id = ++state.tabSeq;
      const container = document.createElement("div");
      container.style.height = "100%";
      termHost.appendChild(container);
      const term = new Terminal({
        cursorBlink: true,
        fontFamily: "IBM Plex Mono, Menlo, Consolas, monospace",
        theme: { background: "#0f130d", foreground: "#e8ecdf", cursor: "#8fbf5f" }
      });
      const fit = new FitAddon.FitAddon();
      term.loadAddon(fit);
      term.open(container);
      fit.fit();

      const base = new URL(device.shell_url, window.location.origin);
      const wsProto = base.protocol === "https:" ? "wss" : "ws";
      const effectiveUrl = `${wsProto}://${base.host}/v1/pty?access_token=${encodeURIComponent(state.token)}`;
      const realSocket = new WebSocket(effectiveUrl);

      realSocket.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === "output") term.write(msg.data);
          if (msg.type === "exit") term.writeln(`\r\n[exit ${msg.code}]`);
        } catch {
          term.write(event.data);
        }
      };
      realSocket.onerror = () => term.writeln("\r\n[websocket error]");
      term.onData((data) => {
        if (realSocket.readyState === WebSocket.OPEN) {
          realSocket.send(JSON.stringify({ type: "input", data }));
        }
      });
      const sendResize = () => {
        fit.fit();
        if (realSocket.readyState === WebSocket.OPEN) {
          realSocket.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
        }
      };
      window.addEventListener("resize", sendResize);
      realSocket.onopen = sendResize;

      const tab = {
        id,
        title: `${device.device_id}#${id}`,
        container,
        term,
        fit,
        socket: realSocket
      };
      state.tabs.push(tab);
      activateTab(id);
    }

    async function login() {
      const token = tokenInput.value.trim() || localStorage.getItem(TOKEN_KEY) || "";
      if (!token) {
        loginHint.textContent = "Token required.";
        return;
      }
      state.token = token;
      try {
        await loadDevices();
        localStorage.setItem(TOKEN_KEY, token);
        loginView.hidden = true;
        appView.hidden = false;
      } catch (err) {
        loginHint.textContent = String(err);
      }
    }

    loginButton.onclick = login;
    document.getElementById("refreshButton").onclick = () => loadDevices().catch((err) => {
      headerMeta.textContent = String(err);
    });
    document.getElementById("newTabButton").onclick = () => {
      if (state.selectedDevice) openTab(state.selectedDevice);
    };

    const hash = location.hash.replace(/^#/, "");
    if (hash.startsWith("token=")) {
      tokenInput.value = decodeURIComponent(hash.slice(6));
      history.replaceState({}, "", location.pathname);
    } else {
      tokenInput.value = localStorage.getItem(TOKEN_KEY) || "";
    }
    if (tokenInput.value) login();
  </script>
</body>
</html>
